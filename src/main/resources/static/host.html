<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebRTC Host</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css"> <!-- Custom styles -->
</head>
<body>
    <div class="container mt-4">
        <header class="text-center mb-4">
            <h1>WebRTC Host Page</h1>
        </header>

        <div class="row justify-content-center mb-3">
            <div class="col-md-8 col-lg-6">
                <video id="localVideo" autoplay playsinline muted class="img-fluid border rounded shadow-sm"></video>
            </div>
        </div>

        <div class="text-center mb-3">
            <button id="startHostButton" class="btn btn-primary btn-lg">Become Host</button>
        </div>

        <div id="status" class="alert alert-info" role="alert">Status: Idle</div>

        <div class="mt-4">
            <h3>Client Queue</h3>
            <ul id="clientQueueList" class="list-group">
                <!-- Client items will be populated here by host.js -->
                <li class="list-group-item">No clients in queue.</li>
            </ul>
        </div>

        <div class="mt-3 text-center">
             <button id="endCurrentClientSessionButton" class="btn btn-danger" style="display: none;">End Current Client's Session</button>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/host.js"></script>
</body>
</html>
